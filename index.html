<!DOCTYPE html>
<html lang="pl" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Logowania — Glassmorphism</title>
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          animation: {
            'blob-slow': 'blob 12s infinite alternate ease-in-out',
            'blob-fast': 'blob 8s infinite alternate-reverse ease-in-out',
          },
          keyframes: {
            blob: {
              '0%': { transform: 'translate(0px, 0px) scale(1)' },
              '33%': { transform: 'translate(30px, -40px) scale(1.1)' },
              '66%': { transform: 'translate(-20px, 30px) scale(0.95)' },
              '100%': { transform: 'translate(0px, 0px) scale(1)' },
            }
          }
        }
      }
    }
  </script>
  
  <style>
    /* Subtelne tło siatki dla uwypuklenia efektu szkła */
    .bg-mesh-dots {
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    
    /* Efekt poświaty obramowania glassmorphism */
    .glass-card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 1px 0 rgba(255, 255, 255, 0.2);
    }
    
    .glass-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-input:focus {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(56, 189, 248, 0.6);
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15), inset 0 1px 1px 0 rgba(255, 255, 255, 0.1);
    }

    .glass-button-social {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.2s ease;
    }
    .glass-button-social:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="h-full bg-[#070b14] text-slate-100 font-sans antialiased selection:bg-cyan-500 selection:text-white flex items-center justify-center p-4 sm:p-6 relative overflow-hidden">

  <!-- ================= TŁO Z EFEKTAMI ŚWIATŁA (Ambient Glowing Orbs) ================= -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden">
    <div class="absolute inset-0 bg-mesh-dots opacity-40"></div>
    
    <!-- Kula światła 1: Fiolet/Indigo (Góra-Lewo) -->
    <div class="absolute -top-32 -left-32 w-96 h-96 sm:w-[32rem] sm:h-[32rem] bg-indigo-600/30 rounded-full blur-[110px] animate-blob-slow"></div>
    
    <!-- Kula światła 2: Błękit/Cyan (Dół-Prawo) -->
    <div class="absolute -bottom-32 -right-32 w-96 h-96 sm:w-[34rem] sm:h-[34rem] bg-cyan-500/25 rounded-full blur-[120px] animate-blob-fast"></div>
    
    <!-- Kula światła 3: Akcent Magenta (Środek-Góra) -->
    <div class="absolute top-1/3 left-1/2 -translate-x-1/2 w-80 h-80 bg-purple-600/20 rounded-full blur-[100px] pointer-events-none"></div>
  </div>

  <!-- ================= GŁÓWNA KARTA LOGOWANIA (Glass Card) ================= -->
  <main class="w-full max-w-md relative z-10 my-auto">
    
    <div class="glass-card rounded-3xl p-7 sm:p-9 relative overflow-hidden transition-all duration-300">
      
      <!-- Subtelna linia odbłysku na samej górze karty -->
      <div class="absolute inset-x-0 top-0 h-[1.5px] bg-gradient-to-r from-transparent via-white/50 to-transparent"></div>

      <!-- Nagłówek i Logo -->
      <div class="text-center mb-7">
        <div class="inline-flex items-center justify-center w-13 h-13 p-3.5 mb-4 rounded-2xl bg-white/[0.08] border border-white/[0.18] shadow-inner shadow-white/20">
          <svg class="w-7 h-7 text-cyan-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
          </svg>
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white">Zaloguj się</h1>
        <p class="text-slate-400 text-sm mt-1.5 font-normal">Witaj ponownie! Wprowadź swoje dane dostępowe.</p>
      </div>

      <!-- Formularz Logowania -->
      <form id="login-form" class="space-y-4" onsubmit="event.preventDefault(); handleSubmit();">
        
        <!-- Pole: E-mail -->
        <div class="space-y-1.5">
          <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-300">Adres e-mail</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
              </svg>
            </div>
            <input 
              type="email" 
              id="email" 
              name="email"
              required 
              placeholder="twoj@email.com" 
              class="glass-input w-full pl-11 pr-4 py-3 rounded-xl text-sm text-white placeholder-slate-400 focus:outline-none"
            >
          </div>
        </div>

        <!-- Pole: Hasło -->
        <div class="space-y-1.5">
          <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-300">Hasło</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z" />
              </svg>
            </div>
            <input 
              type="password" 
              id="password" 
              name="password"
              required 
              placeholder="••••••••••••" 
              class="glass-input w-full pl-11 pr-11 py-3 rounded-xl text-sm text-white placeholder-slate-400 focus:outline-none"
            >
            <!-- Przełącznik widoczności hasła -->
            <button 
              type="button" 
              id="toggle-password" 
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-200 transition-colors focus:outline-none"
              aria-label="Pokaż lub ukryj hasło"
            >
              <svg id="eye-icon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Zapamiętaj mnie & Nie pamiętasz hasła? -->
        <div class="flex items-center justify-between text-xs sm:text-sm pt-1">
          <label class="flex items-center gap-2 cursor-pointer select-none text-slate-300 hover:text-slate-200">
            <input 
              type="checkbox" 
              id="remember-me" 
              class="w-4 h-4 rounded bg-white/10 border-white/20 text-cyan-500 focus:ring-cyan-500/30 focus:ring-offset-0 transition cursor-pointer accent-cyan-400"
            >
            <span>Zapamiętaj mnie</span>
          </label>
          <a href="#forgot" class="font-medium text-cyan-400 hover:text-cyan-300 underline-offset-4 hover:underline transition-colors">
            Nie pamiętasz hasła?
          </a>
        </div>

        <!-- Przycisk Zaloguj Się -->
        <div class="pt-2">
          <button 
            type="submit" 
            id="submit-btn"
            class="w-full relative group overflow-hidden rounded-xl font-semibold text-sm sm:text-base text-white py-3.5 px-6 shadow-lg shadow-cyan-500/20 hover:shadow-cyan-500/35 transition-all duration-300 hover:scale-[1.01] active:scale-[0.99] focus:outline-none focus:ring-2 focus:ring-cyan-400/50"
          >
            <!-- Gradient tła przycisku -->
            <div class="absolute inset-0 bg-gradient-to-r from-blue-600 via-indigo-600 to-cyan-500 group-hover:from-blue-500 group-hover:via-indigo-500 group-hover:to-cyan-400 transition-all duration-300"></div>
            <!-- Subtelny efekt połysku hover -->
            <div class="absolute inset-0 opacity-0 group-hover:opacity-100 bg-gradient-to-t from-transparent via-white/20 to-transparent transition-opacity duration-300"></div>
            <span class="relative z-10 flex items-center justify-center gap-2 tracking-wide font-medium">
              Zaloguj się
              <svg class="w-4 h-4 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
              </svg>
            </span>
          </button>
        </div>

      </form>

      <!-- Separator -->
      <div class="relative my-6 text-center">
        <div class="absolute inset-0 flex items-center" aria-hidden="true">
          <div class="w-full border-t border-white/10"></div>
        </div>
        <div class="relative flex justify-center text-xs uppercase tracking-wider">
          <span class="px-3 bg-transparent text-slate-400 font-medium backdrop-blur-sm">lub kontynuuj przez</span>
        </div>
      </div>

      <!-- Logowanie społecznościowe -->
      <div class="grid grid-cols-3 gap-3">
        <!-- Google -->
        <button 
          type="button" 
          aria-label="Zaloguj przez Google"
          class="glass-button-social flex items-center justify-center py-2.5 px-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-white/20"
        >
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/>
            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
            <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3 0-.8.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12s.7 2.3 1.9 4.7l3.7-1.9z"/>
            <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z"/>
          </svg>
        </button>

        <!-- GitHub -->
        <button 
          type="button" 
          aria-label="Zaloguj przez GitHub"
          class="glass-button-social flex items-center justify-center py-2.5 px-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-white/20"
        >
          <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
          </svg>
        </button>

        <!-- Apple -->
        <button 
          type="button" 
          aria-label="Zaloguj przez Apple"
          class="glass-button-social flex items-center justify-center py-2.5 px-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-white/20"
        >
          <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.93-2.85-.9.04-1.99.6-2.63 1.35-.57.65-1.06 1.71-.93 2.73 1.01.08 2.02-.48 2.63-1.23z"/>
          </svg>
        </button>
      </div>

      <!-- Stopka: Link do rejestracji -->
      <p class="text-center text-xs sm:text-sm text-slate-400 mt-7">
        Nie masz jeszcze konta? 
        <a href="#register" class="font-semibold text-cyan-400 hover:text-cyan-300 underline-offset-4 hover:underline transition-colors ml-1">
          Zarejestruj się
        </a>
      </p>

    </div>

    <!-- Feedback Toast (ukryty domyślnie) -->
    <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-50 glass-card px-5 py-3 rounded-2xl flex items-center gap-3 text-sm text-emerald-300 border-emerald-500/30 shadow-2xl transition-all">
      <svg class="w-5 h-5 text-emerald-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span>Pomyślnie zalogowano (tryb demonstracyjny)</span>
    </div>

  </main>

  <!-- ================= INTERAKCJE JS ================= -->
  <script>
    // Przełączanie widoczności hasła
    const togglePasswordBtn = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eye-icon');

    const eyeOpenSvg = `
      <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
    `;

    const eyeSlashSvg = `
      <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
    `;

    togglePasswordBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      eyeIcon.innerHTML = isPassword ? eyeSlashSvg : eyeOpenSvg;
    });

    // Obsługa kliknięcia "Zaloguj się"
    function handleSubmit() {
      const toast = document.getElementById('toast');
      toast.classList.remove('hidden');
      toast.classList.add('flex');
      
      setTimeout(() => {
        toast.classList.add('hidden');
        toast.classList.remove('flex');
      }, 3500);
    }
  </script>
</body>
</html>
